          mkdir -p app/src-tauri/gen/android
          cat > app/src-tauri/gen/android/keystore.properties << EOF
          password=android
          keyAlias=androiddebugkey
          storeFile=${HOME}/.android/debug.keystore
          EOF

      - name: Build Android APK aarch64
        run: |
          cd app
          # bun run tauri:android:build
          npx tauri android build --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.11902837
          ORG_GRADLE_PROJECT_abiList: arm64-v8a
          ORG_GRADLE_PROJECT_archList: arm64
          ORG_GRADLE_PROJECT_targetList: aarch64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blinko-android-apk
          path: app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          retention-days: 7
